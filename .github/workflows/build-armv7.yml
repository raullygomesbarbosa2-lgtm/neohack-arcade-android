name: Build Vortix Pro public ARMv7 34-core APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}" "cmake;3.22.1"
      - name: Generate Android project files
        run: python3 make_apk_project.py
      - name: Install Pillow for launcher artwork
        run: python3 -m pip install --user Pillow
      - name: Apply launcher artwork and fix duplicate Kotlin classes
        run: python3 patch_native_project.py
      - name: Add extra retro systems to Android app
        run: python3 patch_retro_systems.py
      - name: Add white-neon UI, ROM detection and arcade combo controls
        run: python3 patch_v096.py
      - name: Improve per-game macros and dark cyan theme
        run: python3 patch_v097.py && python3 patch_vortix_test.py && python3 patch_v098.py && python3 patch_v099.py
      - name: Promote theme and controls into official Vortix
        run: python3 patch_v100_official.py
      - name: Add configurable simultaneous special-move chords
        run: python3 patch_v101_chord_macros.py
      - name: Brand Vortix Pro and keep public build free of a Pix key
        run: python3 patch_v102_pix_button.py
      - name: Reapply core catalog browser to generated sources
        run: python3 patch_v103_core_browser.py
      - name: Configure a single-ABI ARMv7 build
        run: python3 patch_armv7_variant.py
      - name: Add the 30-day first-launch trial
        run: python3 patch_v104_trial.py
      - name: Apply corrected game controls and green theme
        run: python3 patch_v105_game_controls.py
      - name: Make touch controls immediate and finger-friendly
        run: python3 patch_v106_touch_response.py
      - name: Add up to six configurable simultaneous special buttons
        run: python3 patch_v107_dynamic_specials.py
      - name: Configure persistent release signing
        run: python3 patch_public_stable_signing.py
      - name: Download and normalize the exact ARMv7 permissive-metadata allowlist
        run: python3 prepare_armv7_catalog.py
      - name: Validate the 34-core catalog and corrected controls
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          from zipfile import ZipFile
          assets = Path('app/src/main/assets')
          catalog = json.loads((assets / 'core_catalog.json').read_text())
          gradle = Path('app/build.gradle').read_text()
          java = Path('app/src/main/java/br/com/raully/neohackarcade/MainActivity.java').read_text()
          allowed = {'MIT','BSD-3-Clause','zlib','Zlib','Public Domain','ISC','The Unlicense','2-clause BSD','3-clause BSD'}
          expected = set('ardens chailove crocods dingooemu dirksimple doukutsu_rs fixgb fixnes galaksija gw handy jaxe lowresnx lutro mojozork native32emu nekop2 nicaiemu np2kai oberon openlara pd777 play potator sameboy sameduck skyemu spmp8000emu tic80 uw8 uzem vaporspec vircon32 wasm4'.split())
          if "applicationId 'br.com.raully.neohackarcade.pro'" not in gradle or 'minSdk 21' not in gradle:
              raise SystemExit('The public APK must preserve the Pro applicationId and minSdk 21.')
          if "include 'armeabi-v7a'" not in gradle or 'arm64-v8a' in gradle:
              raise SystemExit('The APK must contain only the ARMv7 ABI.')
          cores = catalog.get('cores', [])
          ids = {core.get('id') for core in cores}
          if catalog.get('version') != 1 or len(cores) != 34 or ids != expected:
              raise SystemExit(f'Expected exact 34-core allowlist; got {len(cores)} entries.')
          if sum(core.get('catalogType') == 'libretro' for core in cores) != 23 or sum(core.get('catalogType') == 'engine-virtual' for core in cores) != 11:
              raise SystemExit('Expected 23 Libretro and 11 engine/virtual entries.')
          for core in cores:
              license_name = str(core.get('license', ''))
              low = license_name.lower()
              if license_name not in allowed or any(term in low for term in ('gpl','agpl','lgpl','mame','non-commercial','noncommercial','unknown',' or ','/')):
                  raise SystemExit(f'Restricted/ambiguous license metadata in {core.get("id")}: {license_name}')
              archive = assets / core['coreZip']
              with ZipFile(archive) as bundle:
                  if bundle.namelist() != [core['coreFile']]: raise SystemExit(f'Unexpected package files: {archive}')
                  data = bundle.read(core['coreFile'])
              if len(data) != core['coreBytes'] or __import__('hashlib').sha256(data).hexdigest() != core['sha256']:
                  raise SystemExit(f'ARMv7 core size/hash mismatch: {core["id"]}')
              if len(data) < 20 or data[:4] != b'\x7fELF' or data[4] != 1 or data[5] != 1 or int.from_bytes(data[18:20], 'little') != 40:
                  raise SystemExit(f'{core["id"]} is not a little-endian ARMv7 ELF32 library')
              if core.get('abi') != 'armeabi-v7a' or not core.get('authors') or not core.get('coreInfoUrl') or not core.get('sourceArchiveUrl') or len(core.get('sourceArchiveSha256','')) != 64:
                  raise SystemExit(f'Missing ARMv7 source/author/license/hash metadata: {core["id"]}')
              if not core['sourceArchiveUrl'].startswith('https://buildbot.libretro.com/nightly/android/latest/armeabi-v7a/'):
                  raise SystemExit(f'Non-official ARMv7 source URL: {core["id"]}')
          if 'MAX_SPECIAL_SLOTS = 6' not in java or 'specialControlsRow.setVisibility(visible > 0 ? View.VISIBLE : View.GONE)' not in java:
              raise SystemExit('Dynamic special controls (six slots and hidden blank slots) are missing.')
          if 'Cadillacs' not in java and 'cadillacs' not in java:
              raise SystemExit('Cadillacs and Dinosaurs A+B default is missing.')
          if 'TRIAL_DURATION_MS = 30L * 24L * 60L * 60L * 1000L' not in java or 'if (isTrialExpired())' not in java:
              raise SystemExit('The first-launch 30-day trial gate is missing.')
          if (assets / 'pix_key.txt').exists(): raise SystemExit('A Pix key must not be packaged.')
          forbidden = {'.nes','.sfc','.smc','.gba','.gb','.gbc','.rom','.bin','.cue','.iso','.chd','.bios','.a26','.a78'}
          game_files = [str(path) for path in assets.rglob('*') if path.is_file() and path.suffix.lower() in forbidden and path.parent.name != 'corepacks']
          if game_files: raise SystemExit(f'Game/ROM/BIOS files must not be packaged: {game_files}')
          if any('fbneo' in p.name.lower() or 'mame' in p.name.lower() for p in (Path('app/src/main/jniLibs')).rglob('*')):
              raise SystemExit('MAME/FBNeo native libraries must not be bundled.')
          print('Validated exact 34-core ARMv7 candidate set (23 Libretro, 11 engine/virtual), metadata filter, hashes, controls, trial, and no bundled games/BIOS/Pix key.')
          PY
      - name: Package permissive SPDX texts and generated core attributions
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/licenses
          curl -fL --retry 3 https://spdx.org/licenses/MIT.txt -o app/src/main/assets/licenses/MIT.txt
          curl -fL --retry 3 https://spdx.org/licenses/BSD-2-Clause.txt -o app/src/main/assets/licenses/BSD-2-Clause.txt
          curl -fL --retry 3 https://spdx.org/licenses/BSD-3-Clause.txt -o app/src/main/assets/licenses/BSD-3-Clause.txt
          curl -fL --retry 3 https://spdx.org/licenses/Zlib.txt -o app/src/main/assets/licenses/Zlib.txt
          curl -fL --retry 3 https://spdx.org/licenses/ISC.txt -o app/src/main/assets/licenses/ISC.txt
          curl -fL --retry 3 https://spdx.org/licenses/Unlicense.txt -o app/src/main/assets/licenses/Unlicense.txt
          curl -fL --retry 3 https://raw.githubusercontent.com/Swordfish90/LibretroDroid/0.13.2/LICENSE -o app/src/main/assets/licenses/LibretroDroid-LICENSE.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          catalog=json.loads(Path('app/src/main/assets/core_catalog.json').read_text())
          lines=['# Vortix Pro public ARMv7 core notices','',
          'This reduced catalog was selected using upstream license metadata, not an independent legal audit or legal clearance. The metadata may be incomplete or stale; review upstream sources and terms before redistribution. Core binaries are unmodified official Libretro Android nightly builds, normalized into single-library ZIPs for delivery. No games, ROMs, BIOS files, or Pix key are included.','',
          'Each SHA-256 below identifies the original official binary archive and the normalized core library. Core metadata and license labels are reproduced from upstream catalog data.','',
          '| Core | System | Author(s) | Upstream license metadata | Core info | Official ARMv7 binary archive | Archive SHA-256 | Library SHA-256 |','|---|---|---|---|---|---|---|---|']
          for c in catalog['cores']:
              def esc(v): return str(v or 'Not stated').replace('|','\\|').replace('\n',' ')
              lines.append('| '+' | '.join(esc(x) for x in (c['name'],c['system'],c.get('authors'),c['license'],c['coreInfoUrl'],c['sourceArchiveUrl'],c.get('sourceArchiveSha256'),c.get('sha256')))+' |')
          lines += ['', '## Public-domain metadata', '', 'Entries whose upstream metadata says “Public Domain” are identified individually in the table above. That generic metadata label is not a substitute for an independent review of the relevant source and jurisdiction; no SPDX text is asserted for it.', '', '## Included license texts', '', 'The app assets include full SPDX license texts for MIT, BSD-2-Clause, BSD-3-Clause, Zlib, ISC, and The Unlicense, plus the LibretroDroid license text. Other license labels appear as stated in upstream metadata.']
          Path('app/src/main/assets/PUBLIC-CORE-NOTICES.md').write_text('\n'.join(lines)+'\n')
          PY
      - name: Prepare stable Vortix signing keystore
        env:
          VORTIX_SIGNING_BUNDLE: ${{ secrets.VORTIX_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          raw = os.environ.get('VORTIX_SIGNING_BUNDLE', '')
          if not raw: raise SystemExit('Missing repository secret VORTIX_SIGNING_BUNDLE.')
          bundle = json.loads(raw)
          required = ('keystore_base64', 'store_password', 'key_alias', 'key_password')
          missing = [name for name in required if not bundle.get(name)]
          if missing: raise SystemExit(f'Signing bundle is missing fields: {missing}')
          path = Path(os.environ['RUNNER_TEMP']) / 'vortix-release.p12'
          data = base64.b64decode(bundle['keystore_base64'], validate=True)
          if len(data) < 100: raise SystemExit('Signing keystore data is too small.')
          path.write_bytes(data); path.chmod(0o600)
          variables = {'VORTIX_KEYSTORE_PATH': str(path), 'VORTIX_KEYSTORE_PASSWORD': bundle['store_password'], 'VORTIX_KEY_ALIAS': bundle['key_alias'], 'VORTIX_KEY_PASSWORD': bundle['key_password'], 'VORTIX_KEYSTORE_TYPE': bundle.get('keystore_type', 'PKCS12')}
          with Path(os.environ['GITHUB_ENV']).open('a') as env_file:
              for name, value in variables.items():
                  if '\n' in value or '\r' in value: raise SystemExit(f'Invalid newline in {name}.')
                  env_file.write(f'{name}={value}\n')
          PY
      - name: Build stable-signed ARMv7 Vortix Pro trial APK
        run: gradle assembleRelease --no-daemon
      - name: Verify release APK ABI, cores, notices, and signature
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json
          apk=Path('app/build/outputs/apk/release/app-armeabi-v7a-release.apk')
          if not apk.is_file(): raise SystemExit(f'Missing release APK: {apk}')
          catalog=json.loads(Path('app/src/main/assets/core_catalog.json').read_text())
          with ZipFile(apk) as z:
              names=set(z.namelist())
              native=[name for name in names if name.startswith('lib/')]
              if any(not name.startswith('lib/armeabi-v7a/') for name in native): raise SystemExit(f'APK contains a foreign ABI: {native}')
              if any(('mame' in name.lower() or 'fbneo' in name.lower()) for name in native): raise SystemExit('APK contains a MAME/FBNeo native library.')
              required=['assets/core_catalog.json','assets/PUBLIC-CORE-NOTICES.md']+[f'assets/licenses/{name}.txt' for name in ('MIT','BSD-2-Clause','BSD-3-Clause','Zlib','ISC','Unlicense')]
              for name in required:
                  if name not in names: raise SystemExit(f'Missing public notice/catalog asset: {name}')
              packaged=json.loads(z.read('assets/core_catalog.json'))
              if len(packaged.get('cores',[]))!=34: raise SystemExit('APK does not contain the filtered 34-core catalog.')
              forbidden={'.nes','.sfc','.smc','.gba','.gb','.gbc','.rom','.bin','.cue','.iso','.chd','.bios','.a26','.a78'}
              game_files=[n for n in names if n.startswith('assets/') and Path(n).suffix.lower() in forbidden and '/corepacks/' not in n]
              if game_files: raise SystemExit(f'APK bundles games/ROM/BIOS files: {game_files}')
              if any(n.lower().endswith('/pix_key.txt') for n in names): raise SystemExit('APK contains a Pix key asset.')
              special=[core['id'] for core in packaged['cores']]
          print(f'Validated signed ARMv7 APK {apk} ({apk.stat().st_size} bytes); embedded catalog has {len(special)} entries.')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-armeabi-v7a-release.apk | grep -F "package: name='br.com.raully.neohackarcade.pro'"
      - name: Upload public-candidate ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: Vortix-Pro-armv7-public-34perm-trial30d
          path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 7
