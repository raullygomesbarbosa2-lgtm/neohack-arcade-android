name: Build Vortix APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      NDK_VERSION: 27.2.12479018
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}" "cmake;3.22.1"
      - name: Generate Android project files
        run: python3 make_apk_project.py
      - name: Install Pillow for launcher artwork
        run: python3 -m pip install --user Pillow
      - name: Apply launcher artwork and fix duplicate Kotlin classes
        run: python3 patch_native_project.py
      - name: Add extra retro systems to Android app
        run: python3 patch_retro_systems.py
      - name: Add white-neon UI, ROM detection and arcade combo controls
        run: python3 patch_v096.py
      - name: Add LibretroDroid license
        run: |
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets"
          curl -fL --retry 3 https://raw.githubusercontent.com/Swordfish90/LibretroDroid/0.13.2/LICENSE -o "$GITHUB_WORKSPACE/app/src/main/assets/LibretroDroid-LICENSE.txt"
      - name: Build Snes9x native core for Super Nintendo
        run: |
          git clone --depth 1 https://github.com/libretro/snes9x.git "$RUNNER_TEMP/snes9x"
          cd "$RUNNER_TEMP/snes9x/libretro/jni"
          "$ANDROID_HOME/ndk/${NDK_VERSION}/ndk-build" \
            APP_ABI="armeabi-v7a arm64-v8a" APP_PLATFORM=android-21 -j2
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a" "$GITHUB_WORKSPACE/app/src/main/assets"
          ARMV7_CORE=$(find "$RUNNER_TEMP/snes9x" -type f -path '*/armeabi-v7a/libretro.so' -print -quit)
          ARM64_CORE=$(find "$RUNNER_TEMP/snes9x" -type f -path '*/arm64-v8a/libretro.so' -print -quit)
          test -n "$ARMV7_CORE" && test -n "$ARM64_CORE"
          cp "$ARMV7_CORE" "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/libsnes9x_libretro_android.so"
          cp "$ARM64_CORE" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libsnes9x_libretro_android.so"
          cp "$RUNNER_TEMP/snes9x/LICENSE" "$GITHUB_WORKSPACE/app/src/main/assets/Snes9x-LICENSE.txt"
          if [ -f "$RUNNER_TEMP/snes9x/filter/snes_ntsc-license.txt" ]; then cp "$RUNNER_TEMP/snes9x/filter/snes_ntsc-license.txt" "$GITHUB_WORKSPACE/app/src/main/assets/Snes9x-NTSC-LICENSE.txt"; fi
      - name: Build Genesis Plus GX native core for classic Sega systems
        run: |
          git clone --depth 1 https://github.com/libretro/Genesis-Plus-GX-Wide.git "$RUNNER_TEMP/genesis-plus-gx"
          cd "$RUNNER_TEMP/genesis-plus-gx/libretro/jni"
          "$ANDROID_HOME/ndk/${NDK_VERSION}/ndk-build" \
            APP_ABI="armeabi-v7a arm64-v8a" APP_PLATFORM=android-21 -j2
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a" "$GITHUB_WORKSPACE/app/src/main/assets"
          ARMV7_CORE=$(find "$RUNNER_TEMP/genesis-plus-gx" -type f -path '*/armeabi-v7a/libretro.so' -print -quit)
          ARM64_CORE=$(find "$RUNNER_TEMP/genesis-plus-gx" -type f -path '*/arm64-v8a/libretro.so' -print -quit)
          test -n "$ARMV7_CORE" && test -n "$ARM64_CORE"
          cp "$ARMV7_CORE" "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/libgenesis_plus_gx_libretro_android.so"
          cp "$ARM64_CORE" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libgenesis_plus_gx_libretro_android.so"
          cp "$RUNNER_TEMP/genesis-plus-gx/LICENSE.txt" "$GITHUB_WORKSPACE/app/src/main/assets/Genesis-Plus-GX-LICENSE.txt"
      - name: Build MAME 2003-Plus native core for classic arcade
        run: |
          git clone --depth 1 https://github.com/libretro/mame2003-plus-libretro.git "$RUNNER_TEMP/mame2003-plus"
          cd "$RUNNER_TEMP/mame2003-plus/jni"
          "$ANDROID_HOME/ndk/${NDK_VERSION}/ndk-build" \
            APP_ABI="armeabi-v7a arm64-v8a" APP_PLATFORM=android-21 -j2
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a" "$GITHUB_WORKSPACE/app/src/main/assets"
          ARMV7_CORE=$(find "$RUNNER_TEMP/mame2003-plus" -type f -path '*/armeabi-v7a/libretro.so' -print -quit)
          ARM64_CORE=$(find "$RUNNER_TEMP/mame2003-plus" -type f -path '*/arm64-v8a/libretro.so' -print -quit)
          test -n "$ARMV7_CORE" && test -n "$ARM64_CORE"
          cp "$ARMV7_CORE" "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/libmame2003_plus_libretro_android.so"
          cp "$ARM64_CORE" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libmame2003_plus_libretro_android.so"
          cp "$RUNNER_TEMP/mame2003-plus/LICENSE.md" "$GITHUB_WORKSPACE/app/src/main/assets/MAME2003-Plus-LICENSE.md"
      - name: Build additional classic console cores
        run: |
          set -euo pipefail
          build_core() {
            local id="$1" repo="$2" checkout="$3" subdir="$4" output="$5"
            local src="$RUNNER_TEMP/$id" armv7 arm64 license
            git clone --depth 1 --branch "$checkout" "$repo" "$src"
            cd "$src/$subdir"
            "$ANDROID_HOME/ndk/${NDK_VERSION}/ndk-build" \
              APP_ABI="armeabi-v7a arm64-v8a" APP_PLATFORM=android-21 -j2
            armv7=$(find "$src" -type f -path '*/armeabi-v7a/libretro.so' -print -quit)
            arm64=$(find "$src" -type f -path '*/arm64-v8a/libretro.so' -print -quit)
            test -n "$armv7" && test -n "$arm64"
            cp "$armv7" "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a/lib${output}"
            cp "$arm64" "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/lib${output}"
            license=$(find "$src" -maxdepth 4 -type f \
              \( -iname 'LICENSE*' -o -iname 'COPYING*' \) -print -quit)
            if [ -n "$license" ]; then
              cp "$license" "$GITHUB_WORKSPACE/app/src/main/assets/${id}-LICENSE.txt"
            else
              echo "No top-level license file found for $id; preserving source license reference in README."
            fi
          }
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/armeabi-v7a" \
            "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a" \
            "$GITHUB_WORKSPACE/app/src/main/assets"
          build_core fceumm https://github.com/libretro/libretro-fceumm.git master jni fceumm_libretro_android.so
          build_core gambatte https://github.com/libretro/gambatte-libretro.git master libgambatte/libretro/jni gambatte_libretro_android.so
          build_core mednafen_gba https://github.com/libretro/beetle-gba-libretro.git master jni mednafen_gba_libretro_android.so
          build_core stella2014 https://github.com/libretro/stella2014-libretro.git master jni stella2014_libretro_android.so
          build_core prosystem https://github.com/libretro/prosystem-libretro.git master jni prosystem_libretro_android.so
          build_core mednafen_pce_fast https://github.com/libretro/beetle-pce-fast-libretro.git master jni mednafen_pce_fast_libretro_android.so
          build_core mednafen_lynx https://github.com/libretro/beetle-lynx-libretro.git master jni mednafen_lynx_libretro_android.so
          build_core mednafen_ngp https://github.com/libretro/beetle-ngp-libretro.git master jni mednafen_ngp_libretro_android.so
          build_core mednafen_wswan https://github.com/libretro/beetle-wswan-libretro.git master jni mednafen_wswan_libretro_android.so
      - name: Download and verify FBNeo and MAME ROMset cores
        shell: bash
        run: |
          set -euo pipefail
          base='https://buildbot.libretro.com/nightly/android/latest'
          mkdir -p app/src/main/assets/cores app/src/main/assets/licenses
          test -s app/src/main/assets/licenses/FBNeo-License.txt
          test -s app/src/main/assets/licenses/MAME-2000-LICENSE.txt
          test -s app/src/main/assets/licenses/MAME-2003-LICENSE.md
          test -s app/src/main/assets/licenses/MAME-2010-LICENSE.txt
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "app/src/main/jniLibs/$abi"
            for core in fbneo mame2000 mame2003 mame2010; do
              curl -fL --retry 4 "$base/$abi/${core}_libretro_android.so.zip" -o "$RUNNER_TEMP/$abi-$core.zip"
            done
          done
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, os
          cores=('fbneo','mame2000','mame2003','mame2010')
          lines=['Official Libretro Android nightly/latest cores; hashes identify this build.']
          for abi in ('arm64-v8a','armeabi-v7a'):
              for core in cores:
                  archive=Path(os.environ['RUNNER_TEMP']) / f'{abi}-{core}.zip'
                  expected=f'{core}_libretro_android.so'
                  with ZipFile(archive) as z:
                      matches=[n for n in z.namelist() if Path(n).name==expected]
                      if len(matches)!=1: raise SystemExit(f'Missing/duplicate {expected} in {archive}')
                      data=z.read(matches[0])
                  if len(data)<1_000_000 or data[:4]!=b'\x7fELF': raise SystemExit(f'Invalid core {expected}')
                  output=Path('app/src/main/jniLibs')/abi/('lib'+expected)
                  output.write_bytes(data)
                  lines.append(f'{abi}/{core} archive SHA-256 {hashlib.sha256(archive.read_bytes()).hexdigest()}')
                  lines.append(f'{abi}/{core} library bytes {len(data)}')
          Path('app/src/main/assets/cores/ARCADE_BUILD_INFO.txt').write_text('\n'.join(lines)+'\n')
          PY
      - name: Build installable Vortix APK
        run: gradle assembleDebug --no-daemon
      - name: Verify all arcade cores are in the APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          apk=Path('app/build/outputs/apk/debug/app-debug.apk')
          cores=('fbneo','mame2000','mame2003','mame2003_plus','mame2010')
          expected=[f'lib/{abi}/lib{core}_libretro_android.so' for abi in ('arm64-v8a','armeabi-v7a') for core in cores]
          with ZipFile(apk) as z:
              names=set(z.namelist())
              missing=[name for name in expected if name not in names]
              if missing: raise SystemExit(f'Missing arcade core libraries: {missing}')
              for name in expected:
                  with z.open(name) as f:
                      if f.read(4)!=b'\x7fELF': raise SystemExit(f'Invalid native library: {name}')
              for name in ('assets/licenses/FBNeo-License.txt','assets/licenses/MAME-2000-LICENSE.txt','assets/licenses/MAME-2003-LICENSE.md','assets/licenses/MAME-2010-LICENSE.txt','assets/cores/ARCADE_BUILD_INFO.txt'):
                  if name not in names: raise SystemExit(f'Missing core notice/build info: {name}')
          print(f'Verified {len(expected)} arcade libraries in {apk} ({apk.stat().st_size} bytes)')
          PY
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Vortix.apk
          gh release create "native-${GITHUB_RUN_NUMBER}" dist/Vortix.apk \
            --target "$GITHUB_SHA" \
            --title "Vortix classic systems ${GITHUB_RUN_NUMBER}" \
            --notes "Vortix 0.9.6: white-neon library; automatic ROM-system detection for supported formats and ZIP contents; visible per-system core catalog; CHIP-8; SNES9x; Genesis Plus GX; NES/FCEUmm; GB/GBC/Gambatte; GBA/Beetle GBA; Atari 2600/7800; PC Engine; Lynx; Neo Geo Pocket; WonderSwan. Arcade core library: FBNeo and MAME 2000 (0.37b5), MAME 2003 (0.78), MAME 2003-Plus (0.78+) and MAME 2010 (0.139), with manual core choice per game. Round neon A/B/C/D buttons, cyan joystick, and four per-game double-tap special macros with sequential and simultaneous steps such as A+B. Immersive full-screen game view. ARMv7 + ARM64, Android 5.0+. Already-patched ROM hacks are supported when they use a supported format. No ROMs or BIOS included; arcade compatibility depends on a matching ROMset/core, and the arcade cores have non-commercial licenses."
